name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make sure that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack the published packages
        run: |
          mkdir packed
          pnpm -r pack --pack-destination packed --json |
            jq 'map({name, version, file: (.filename | split("/") | last)})' > packed/packages.json
          jq -e --arg version "${GITHUB_REF_NAME#v}" 'length > 0 and all(.version == $version)' packed/packages.json ||
            { echo "::error::Every published package must have version ${GITHUB_REF_NAME#v}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packed
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/org/opengardenjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packed
      - name: Publish to npm
        run: |
          dist_tag=latest
          case "$GITHUB_REF_NAME" in *-*) dist_tag=next ;; esac
          jq -r '.[] | "\(.name) \(.version) \(.file)"' packed/packages.json |
            while read -r name version file; do
              if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
                echo "$name@$version is already on npm"
                continue
              fi
              npm publish "./packed/$file" --access public --provenance --ignore-scripts --tag "$dist_tag"
            done

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packed
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packed/*.tgz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "| Package | npm | Source |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "\(.name) \(.version) \(.file)"' packed/packages.json |
              while read -r name version file; do
                dir=$(tar -xzOf "packed/$file" package/package.json | jq -r .repository.directory)
                echo "| \`$name\` | [$version](https://www.npmjs.com/package/$name/v/$version) | [$dir]($repo_url/tree/$GITHUB_REF_NAME/$dir) |"
              done
            echo
            echo "Each \`.tgz\` below is the file that went to npm. To make sure that a file came from this workflow, run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } > notes.md
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" packed/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            "${prerelease[@]}"
